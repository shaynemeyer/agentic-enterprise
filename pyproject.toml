[project]
name = "enterprise-agentic-workflow"
version = "0.1.0"
description = "FastAPI host for LangGraph agent logic"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.20",
    "langchain-openai>=0.2.0",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "integration: exercises real external services (e.g. the LLM backend), not just app code",
]
