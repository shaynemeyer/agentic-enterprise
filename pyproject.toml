[project]
name = "enterprise-agentic-workflow"
version = "0.1.0"
description = "Sovereign Multi-Agent System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "langgraph>=0.2.0",
  "pydantic-settings>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
managed = true
